@if (document(); as page) {
  <article class="docs-page">
    <h1>{{ page.title }}</h1>
    @if (page.description) {
      <p class="docs-page__description">{{ page.description }}</p>
    }
    <div class="docs-page__body" [innerHTML]="page.html"></div>
  </article>
} @else {
  <article class="docs-page">
    <h1>Page not found</h1>
    <p>The requested documentation page does not exist.</p>
  </article>
}
